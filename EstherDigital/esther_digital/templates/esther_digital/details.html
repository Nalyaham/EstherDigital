<!DOCTYPE html>
{% load static %}
<html lang="en" class="scroll-smooth scroll-pt-5">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultimate Breakup Recovery Bundle | Esther Digital</title>
<meta name="description" content="Four digital resources to help you reflect, heal, rebuild confidence and move forward after a breakup. $17.00.">
<meta property="og:title" content="The Ultimate Breakup Recovery Bundle | Esther Digital">
<meta property="og:description" content="Four digital resources to help you reflect, heal, rebuild confidence and move forward after a breakup. $17.00.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{% static 'esther_digital/fonts.css' %}">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="{% static 'esther_digital/tailwind-config.js' %}"></script>
<script defer src="{% static 'esther_digital/script.js' %}"></script>
</head>
<body data-nav ="products,contact" class="min-h-screen flex flex-col bg-page font-serif font-light text-black">
<div id="site-header"></div>
<main class="flex-1 pt-5">
  <a href="{% url 'product_list' %}" class="inline-flex w-fit items-center gap-2 p-2.5 text-lg">
    <svg aria-hidden="true" class="h-[25px] w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back
  </a>
  <section class="grid items-start gap-2.5 p-2.5 md:grid-cols-2 md:gap-0">
    <img src="{{ product.cover_image.url }}" alt="The Ultimate Breakup Recovery Bundle cover" class="w-full object-contain">
    <div class="flex min-w-0 flex-col items-start gap-[35px] p-2.5">
      <h1 class="text-[2rem] font-normal leading-[1.1] md:text-5xl">{{ product.title }}</h1>
      <p class="text-base font-normal text-brand md:text-lg">{{ product.price }}</p>
      <button type="button" id="buy-button" class="inline-flex min-h-[42px] cursor-pointer items-center justify-center gap-2.5 rounded-lg bg-brand px-[15px] py-2.5 text-lg font-light transition hover:brightness-95">Buy Now</button>
      <div class="text-base leading-[1.45] md:text-lg [&_p]:mb-6 [&_h2]:mb-[18px] [&_h2]:mt-[25px] [&_h2]:text-2xl [&_h2]:font-normal md:[&_h2]:text-[2rem] [&_h3]:mb-2 [&_h3]:text-lg [&_h3]:font-normal md:[&_h3]:text-xl [&_ul]:mb-6 [&_li]:mb-[7px]">
        <p>{{ product.description }}</p>
      </div>
    </div>
  </section>
</main>
<dialog id="purchase-dialog" aria-labelledby="purchase-title" class="m-auto max-w-[440px] rounded-lg border border-line bg-page p-[30px] text-black shadow-form backdrop:bg-black/35">
  <h2 id="purchase-title" class="mb-5 text-2xl font-normal md:text-[2rem]">Purchase this guide</h2>
  <p class="mb-6 text-base leading-normal md:text-lg">Online checkout is not available yet. Please contact Esther Digital about purchasing this bundle.</p>
  <div class="flex flex-wrap gap-3">
    <a href="contact.html" class="inline-flex min-h-[42px] cursor-pointer items-center justify-center gap-2.5 rounded-lg bg-brand px-[15px] py-2.5 text-lg font-light transition hover:brightness-95">Contact us</a>
    <button type="button" id="close-dialog" class="cursor-pointer rounded-lg border border-field bg-page px-4 py-2.5 text-lg">Close</button>
  </div>
</dialog>
<div id="site-footer"></div>
</body>
</html>
